[project]
name = "kurpaest"
version = "0.1.0"
description = "Queryable map of places to eat in Lithuania — kurpaest.lt"
readme = "README.md"
authors = [
    { name = "kodokaraliai", email = "grybauskas.matas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.3.5",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
kurpaest = "kurpaest.__main__:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
